{{- if and (not .Values.splitKey.existingSecret) .Values.splitKey.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meatnet-app.secretName" . }}
  labels:
    {{- include "meatnet-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.splitKey.secretKey }}: {{ .Values.splitKey.value | quote }}
{{- end }}
