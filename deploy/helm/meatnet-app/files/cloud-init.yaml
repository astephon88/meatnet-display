#cloud-config
# First boot of the app unit's VM (Alpine's NoCloud image): a kernel with
# Bluetooth (linux-virt has none), the adapter's firmware, BlueZ without EATT,
# and the meatnet service, which builds the unit and runs it. Reboots once.
package_update: true
packages:
  - linux-firmware-rtl_bt
  - linux-lts
  - bluez
  - dbus
  - e2fsprogs
  - git
  - cmake
  - make
  - g++
  - glib-dev
write_files:
  # EATT channels need an encrypted link, so BlueZ would ask every phone to
  # pair, and the phone drops the link after the 30 s security timeout.
  - path: /etc/bluetooth/main.conf
    content: |
      [GATT]
      Channels=1
  - path: /usr/local/lib/meatnet/disks.sh
    content: |
      # The VM's extra disks, found by the serial the VirtualMachine gives them.
      disk_by_serial() {
          for d in /sys/block/vd*; do
              [ "$(cat "$d/serial" 2>/dev/null)" = "$1" ] && { echo "/dev/${d##*/}"; return 0; }
          done
          return 1
      }

      mount_disks() {
          mkdir -p /run/meatnet/config /run/meatnet/key /var/lib/meatnet
          d=$(disk_by_serial meatnet-config) || { eerror "no config disk"; return 1; }
          mountpoint -q /run/meatnet/config || mount -o ro "$d" /run/meatnet/config || return 1
          d=$(disk_by_serial meatnet-key) || { eerror "no key disk"; return 1; }
          mountpoint -q /run/meatnet/key || mount -o ro "$d" /run/meatnet/key || return 1
          d=$(disk_by_serial meatnet-settings) || { eerror "no settings disk"; return 1; }
          if ! mountpoint -q /var/lib/meatnet; then
              blkid "$d" >/dev/null 2>&1 || mkfs.ext4 -q -L meatnet "$d" || return 1
              mount "$d" /var/lib/meatnet || return 1
          fi
      }
  - path: /usr/local/sbin/meatnet-build
    permissions: "0755"
    content: |
      #!/bin/sh
      # meatnet-build REPO REF: build the Linux unit and install it.
      set -e
      repo=$1 ref=$2 src=/var/cache/meatnet/src
      rm -rf "$src" && mkdir -p "$src" && cd "$src"
      git init -q && git fetch -q --depth 1 "$repo" "$ref" && git checkout -q FETCH_HEAD
      cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null
      cmake --build build --target meatnet -j"$(nproc)"
      install -m 0755 build/linux/meatnet /usr/local/bin/meatnet
      mkdir -p /etc/meatnet && printf '%s\n' "$ref" > /etc/meatnet/built-ref
      cd / && rm -rf "$src"
  - path: /etc/init.d/meatnet
    permissions: "0755"
    content: |
      #!/sbin/openrc-run
      description="MeatNet app unit"
      command=/usr/local/bin/meatnet
      command_background=true
      pidfile=/run/meatnet.pid
      output_log=/var/log/meatnet.log
      error_log=/var/log/meatnet.log
      retry="TERM/15/KILL/5"

      depend() {
          need dbus bluetooth net
      }

      start_pre() {
          . /usr/local/lib/meatnet/disks.sh
          mount_disks || return 1
          repo=$(cat /run/meatnet/config/repo) ref=$(cat /run/meatnet/config/ref)
          if [ "$(cat /etc/meatnet/built-ref 2>/dev/null)" != "$ref" ]; then
              ebegin "Building the unit at $ref (a few minutes)"
              /usr/local/sbin/meatnet-build "$repo" "$ref" >/var/log/meatnet-build.log 2>&1
              eend $? "build failed, see /var/log/meatnet-build.log" || [ -x "$command" ] || return 1
          fi
          [ -f /var/lib/meatnet/app.json ] || cp /run/meatnet/config/seed.json /var/lib/meatnet/app.json
          command_args="app --config /var/lib/meatnet/app.json --web-port 8080 --key-file /run/meatnet/key/$(cat /run/meatnet/config/keyfile)"
          modprobe btusb 2>/dev/null
          for i in $(seq 30); do
              [ -e /sys/class/bluetooth/hci0 ] && return 0
              sleep 1
          done
          ewarn "no Bluetooth adapter (hci0) yet"
      }

      # Powered off, the adapter stops advertising even if the unit died.
      stop_post() {
          bluetoothctl power off >/dev/null 2>&1 || true
      }
runcmd:
  - echo btusb >> /etc/modules
  # Boot the lts kernel from now on (the image's extlinux defaults to virt;
  # linux-virt stays installed as a fallback).
  # The apk trigger that builds initramfs-lts doesn't run under cloud-init.
  - mkinitfs -o /boot/initramfs-lts "$(basename /lib/modules/*-lts)"
  - sed -i 's/^default=.*/default=lts/' /etc/update-extlinux.conf
  - update-extlinux
  - rc-update add dbus default
  - rc-update add bluetooth default
  - rc-update add meatnet default
power_state:
  mode: reboot
  message: rebooting into the Bluetooth kernel
